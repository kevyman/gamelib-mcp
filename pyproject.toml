[project]
name = "gamelib-mcp"
version = "0.1.0"
description = "Cross-platform game library MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4.0",
    "httpx>=0.27",
    "howlongtobeatpy>=1.0.22",
    "aiosqlite>=0.22.1,<0.23",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "lxml>=6.1.1",
    "beautifulsoup4>=4.15.0",
    "rapidfuzz>=3.14.5",
    "psnawp>=2.1,<4.0",
    "pynintendoparental>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamelib_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Package façade: deliberate late imports (bottom layer must be defined before
# the leaf submodules import from it) and re-exports that ARE the public API.
"gamelib_mcp/data/db/__init__.py" = ["E402", "F401"]
# load_project_dotenv() must run before the app modules read env at import time.
"gamelib_mcp/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
# Several scraper/provider deps (howlongtobeatpy, psnawp, pynintendoparental)
# ship no type stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The @mcp.tool passthroughs return the tool-layer dicts; FastMCP validates
# them against the annotated pydantic response models at runtime, and those
# annotations are the MCP wire schema. The dict-vs-model mismatch is the
# intended design, not a bug.
module = "gamelib_mcp.main"
disable_error_code = ["return-value"]
