[project]
name = "gamelib-mcp"
version = "0.1.0"
description = "Cross-platform game library MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.5,<4.0",
    "httpx>=0.27",
    # Epic order-history importer: Cloudflare challenges non-browser TLS
    # fingerprints on www.epicgames.com, so the real fetch path impersonates
    # a browser (see data/purchases/epic_orders.py).
    "curl-cffi>=0.15",
    "howlongtobeatpy>=1.0.22",
    "aiosqlite>=0.22.1,<0.23",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "lxml>=6.1.1",
    "beautifulsoup4>=4.15.0",
    "rapidfuzz>=3.14.5",
    "psnawp>=2.1,<4.0",
    "pynintendoparental>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamelib_mcp"]

# skills/ is the canonical home of the gaming skills (ADR 0006); wheel
# installs carry a copy inside the package so skill:// resources work there.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "gamelib_mcp/skills"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# The suite is ~1800 mostly-independent tests over per-test temp databases, so
# it parallelizes cleanly: ~4 minutes serial, ~45s across 8 cores. loadfile
# keeps each file on one worker, which keeps output readable and any file-level
# state a file's own business. Pass -n0 to run serially when debugging.
addopts = "-n auto --dist loadfile"
# A background thread that outlives its event loop is this suite's one
# historically expensive failure: a non-daemon aiosqlite worker thread left
# running past its loop once let the whole run pass and then hang pytest at
# interpreter exit, burning the CI job's six-hour default before failing. It
# announces itself first as a warning, so treat these two as errors rather than
# scrollback — both are raised by pytest itself at test teardown and mean a
# thread or a finalizer blew up somewhere no assertion could see it.
#
# Deliberately scoped to those two categories: a blanket `error` would turn
# every third-party DeprecationWarning into a CI failure on someone else's
# release schedule, which is a different (and much noisier) policy.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 replaced its 59-rule default with a 413-rule one, and this project
# now runs on those defaults. It also *dropped* 18 pycodestyle/pyflakes rules
# from the default set, E402 among them — and the per-file-ignores below only
# exist because E402 was being enforced. Re-select the old default families so
# nothing this codebase already satisfied silently stops being checked.
extend-select = ["E4", "E7", "F"]

[tool.ruff.lint.per-file-ignores]
# Package façade: deliberate late imports (bottom layer must be defined before
# the leaf submodules import from it) and re-exports that ARE the public API.
"gamelib_mcp/data/db/__init__.py" = ["E402", "F401"]
# load_project_dotenv() must run before the app modules read env at import time.
"gamelib_mcp/main.py" = ["E402"]

# The provider layer. Every module here talks to a third-party API or scrapes a
# page someone else controls, and two of the new default rules fight that job:
#
#   BLE001 — a provider fetch degrades to a logged warning and never propagates,
#            so one dead scraper can't abort a whole sync (the "best-effort"
#            contract in gamelib_mcp/data/CLAUDE.md). Narrowing these catches
#            would let an unforeseen parse error take the sync down instead.
#   TRY004 — the isinstance guards here validate untrusted *remote payloads*,
#            not caller arguments. RuntimeError is this layer's established
#            signal for "this provider response is unusable"; TypeError would
#            wrongly imply a bug on our side of the call.
#
# Scoped to the fetchers themselves — data/db/ stays under both rules, where a
# blind except really would be a smell. Isolation boundaries elsewhere in the
# tree (per-item batch handlers, per-check runners) carry an explaining
# `# noqa: BLE001` instead, since those are individual cases in normal modules.
"gamelib_mcp/data/*.py" = ["BLE001", "TRY004"]
"gamelib_mcp/data/purchases/*.py" = ["BLE001", "TRY004"]

# Tests read and write their own temp fixture files inside async test methods.
# There is no event loop to starve there — the blocking read IS the test setup.
"tests/*.py" = ["ASYNC230"]

[tool.mypy]
python_version = "3.11"
# Several scraper/provider deps (howlongtobeatpy, psnawp, pynintendoparental)
# ship no type stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The @mcp.tool passthroughs return the tool-layer dicts; FastMCP validates
# them against the annotated pydantic response models at runtime, and those
# annotations are the MCP wire schema. The dict-vs-model mismatch is the
# intended design, not a bug.
module = "gamelib_mcp.main"
disable_error_code = ["return-value"]
