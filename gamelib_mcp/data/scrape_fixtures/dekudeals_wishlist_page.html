`.browse-cards.view-list` > `.row.row-cols-1` > one `.d-block.col` per item).
Structure and class names (main-link, line-clamp-3, text-tight, badge
badge-danger) verified against a real fetch on 2026-07-02; irrelevant
boilerplate (base64 image data, watch/rating/hide buttons, platform SVG
icons) stripped for fixture size. Two items (Pikmin 4, Paper Mario: The
Thousand-Year Door) are undiscounted exactly as fetched, EUR/comma-decimal
as served. The third item's discount markup (<s>/<strong>/badge-danger -XX%)

DekuDeals page that lists sale items in the shared price-block partial;
this wishlist had no on-sale item at fetch time, so the specific discounted
numbers here are illustrative, not recorded.
-->
