services:
  app:
    build: .
    restart: always
    expose:
      - "8000"
    environment:
      EPIC_LEGENDARY_PATH: /legendary
      LGOGDOWNLOADER_CONFIG_PATH: /config/lgogdownloader
    volumes:
      - ./data/library:/data
      - ${EPIC_LEGENDARY_HOST_PATH:-./data/legendary}:/legendary:ro
      - ${LGOGDOWNLOADER_HOST_PATH:-./data/lgogdownloader}:/config/lgogdownloader:ro
    env_file: .env

  # Add future MCPs here as new services, e.g.:
  # notes-mcp:
  #   build: ./notes-mcp
  #   restart: always
  #   expose:
  #     - "8001"
  #   volumes:
  #     - ./data/notes:/data
  #   env_file: ./notes-mcp/.env

  caddy:
    image: caddy:alpine
    profiles:
      - prod
    restart: always
    environment:
      # Public domain for the Caddyfile's site block. Compose reads the value
      # from the server-local .env (same file the app's env_file points at);
      # the fallback keeps local prod-profile runs working without one.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./stacks:/srv/stacks:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
