services:
  app:
    build: .
    restart: always
    # The app runs as a fixed non-root UID and binds an unprivileged port, so
    # it needs no Linux capabilities at all; dropping them and forbidding
    # privilege escalation bounds what a compromised process can do (CIS
    # Docker 5.3 / 5.25).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    environment:
      EPIC_LEGENDARY_PATH: /legendary
      LGOGDOWNLOADER_CONFIG_PATH: /config/lgogdownloader
    volumes:
      - ./data/library:/data
      - ${EPIC_LEGENDARY_HOST_PATH:-./data/legendary}:/legendary:ro
      - ${LGOGDOWNLOADER_HOST_PATH:-./data/lgogdownloader}:/config/lgogdownloader:ro
    env_file: .env

  # Add future MCPs here as new services, e.g.:
  # notes-mcp:
  #   build: ./notes-mcp
  #   restart: always
  #   expose:
  #     - "8001"
  #   volumes:
  #     - ./data/notes:/data
  #   env_file: ./notes-mcp/.env

  caddy:
    image: caddy:alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles:
      - prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./stacks:/srv/stacks:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
