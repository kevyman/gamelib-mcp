services:
  app:
    # Builds from this checkout (what the deploy workflow does). To run the
    # published image instead, add the docker-compose.image.yml override.
    build: .
    restart: always
    # The app runs as a fixed non-root UID and binds an unprivileged port, so
    # it needs no Linux capabilities at all; dropping them and forbidding
    # privilege escalation bounds what a compromised process can do (CIS
    # Docker 5.3 / 5.25).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    environment:
      EPIC_LEGENDARY_PATH: /legendary
      LGOGDOWNLOADER_CONFIG_PATH: /config/lgogdownloader
    volumes:
      - ./data/library:/data
      - ${EPIC_LEGENDARY_HOST_PATH:-./data/legendary}:/legendary:ro
      - ${LGOGDOWNLOADER_HOST_PATH:-./data/lgogdownloader}:/config/lgogdownloader:ro
    env_file: .env

  # Add future MCPs here as new services, e.g.:
  # notes-mcp:
  #   build: ./notes-mcp
  #   restart: always
  #   expose:
  #     - "8001"
  #   volumes:
  #     - ./data/notes:/data
  #   env_file: ./notes-mcp/.env

  caddy:
    image: caddy:alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles:
      - prod
    restart: always
    # The Caddyfile's site address is {$MCP_PUBLIC_BASE_URL}, the same origin
    # the app's OAuth config requires, so one .env value drives both. It is
    # required here too: with it empty Caddy would parse the site block as a
    # global-options block and start with no site, which the deploy's health
    # gate (it probes the app, not Caddy) would not notice. Compose interpolates
    # the whole file even when this prod-only service is not selected, so the
    # local example sets the value as well.
    environment:
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?set MCP_PUBLIC_BASE_URL in .env (the public origin, e.g. https://gamelib.example.com; http://localhost:8000 for local docker)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./stacks:/srv/stacks:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
