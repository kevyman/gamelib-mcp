name: CI

# Run tests on every pull request. deploy.yml re-runs them on main before
# deploying; this workflow catches failures before merge.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The suite runs in ~2.5 minutes. Without a cap, a process that passes every
    # test and then hangs at interpreter exit (a leaked non-daemon aiosqlite
    # thread does exactly that) burns the 6-hour default before failing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check gamelib_mcp tests scripts

      - name: Type check (mypy)
        run: uv run mypy gamelib_mcp

      - name: Run tests
        run: uv run python -m pytest -q
