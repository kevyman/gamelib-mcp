name: CI

# Run tests on every pull request. deploy.yml re-runs them on main before
# deploying; this workflow catches failures before merge.
on:
  pull_request:

# This workflow only reads the repository; the job token gets nothing else
# (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject declares (requires-python >= 3.11);
        # 3.12 is what the Dockerfile ships. Until 2026-09-01 the suite ran on
        # whichever interpreter setup-uv happened to pick, so neither end of
        # that range was actually pinned by CI.
        python-version: ["3.11", "3.12"]
    # The suite runs in about a minute (pytest-xdist fans it across the runner's
    # cores; see [tool.pytest.ini_options]). Without a cap, a process that
    # passes every test and then hangs at interpreter exit (a leaked non-daemon
    # aiosqlite thread does exactly that) burns the 6-hour default before
    # failing. The cap stays well above the run so a slow runner never trips it.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA; the tag in the
      # trailing comment is informational. A moved tag would otherwise run
      # someone else's code with this job's privileges (Scorecard:
      # Pinned-Dependencies). Dependabot's github-actions entry keeps the SHAs
      # current and rewrites the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Audit locked dependencies for known vulnerabilities
        if: matrix.python-version == '3.12'
        # The export is the fully resolved lockfile (transitive deps included,
        # the project itself excluded), so --no-deps skips pip's re-resolution
        # and audits exactly what uv.lock pins. Dependabot only proposes
        # version bumps for direct dependencies; this is what actually fails a
        # PR whose lockfile carries a published advisory (audit 2026-09-01, #1:
        # pyjwt/starlette/cryptography sat vulnerable in the lock unnoticed).
        # audit.yml re-runs the same check weekly on main for new advisories
        # against an unchanged lockfile.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --no-hashes -o requirements-audit.txt > /dev/null
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --strict --progress-spinner off

      - name: Lint (ruff)
        run: uv run ruff check gamelib_mcp tests scripts

      - name: Type check (mypy)
        run: uv run mypy gamelib_mcp

      - name: Run tests
        run: uv run python -m pytest -q
