# Dependency update automation (audit 2026-07-01, non-obvious improvement #5).
# uv ecosystem covers pyproject.toml + uv.lock; github-actions covers workflows.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
  # Base images are pinned by digest in Dockerfile / docker-compose.yml (audit
  # 2026-09-01, #2); these two entries move the digests forward.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
